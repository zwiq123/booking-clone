services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - ./src:/app/src
      - ./public/uploads:/app/public/uploads
    command: >
      sh -c "sleep 5 &&
             npx prisma migrate deploy &&
             npx prisma db seed &&
             npm run dev"
  db:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata: