version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: booking-db
    environment:
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_password
      POSTGRES_DB: booking_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Node.js Application
  app:
    build: .
    container_name: booking-app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://booking_user:booking_password@db:5432/booking_clone
      JWT_SECRET: test_secret_key_change_in_production
      GMAIL_NAME: test@gmail.com
      GMAIL_PASSWORD: test_password
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public/uploads:/app/public/uploads
    command: >
      sh -c "sleep 5 &&
             npx prisma migrate deploy &&
             npx prisma db seed &&
             npm run dev"

volumes:
  postgres_data:
